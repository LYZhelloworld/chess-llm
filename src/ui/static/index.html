<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>chess-llm</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2f6feb;
    --accent-soft: #e8effd;
    --danger: #c0392b;
    --light-square: #f1ece1;
    --dark-square: #b58863;
    --select: #f7d774;
    --target: rgba(47, 111, 235, 0.35);
    /* Height of the conversation card, as a share of the viewport. */
    --conv-h: clamp(8.75rem, 26vh, 16rem);
  }
  * { box-sizing: border-box; }
  /* Every length below is expressed in rem and the root font-size follows the
     viewport height (1.78vh ~= 16px on a 900px-tall window). Shrinking the
     window therefore scales the whole UI down proportionally - type, padding,
     controls and the board - instead of leaving fixed-size pieces that no
     longer fit and force a page scrollbar. The clamp keeps text legible at the
     bottom and stops it getting comically large on very tall screens. */
  html { height: 100%; font-size: clamp(10px, 1.78vh, 17px); }
  body {
    margin: 0;
    font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex; flex-direction: column;
    height: 100vh;
    height: 100dvh;
    /* The document itself never scrolls: the layout is sized from the viewport
       and any overflow is absorbed by the cards' own scroll areas. */
    overflow: hidden;
  }
  .page { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; max-width: 77.5rem; width: 100%; margin: 0 auto; }
  header { flex: 0 0 auto; background: var(--card); border-bottom: 1px solid var(--border); }
  .header-inner {
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    padding: .875rem 1.375rem;
  }
  h1 { font-size: 1.125rem; margin: 0; letter-spacing: .3px; }
  .meta { color: var(--muted); font-size: .8125rem; }
  /* Layout: two columns. The board owns the left one; the right one splits
     into the game card, which takes all the height the conversation does not
     need, and the conversation below it. The split is resolved by the grids and
     never by subtracting hard-coded chrome from 100vh, so the total can never
     exceed the viewport. */
  .app {
    flex: 1 1 auto; min-height: 0;
    display: grid;
    grid-template-columns: minmax(23rem, 40rem) minmax(21rem, 1fr);
    gap: 1.125rem;
    padding: 1.125rem 1.375rem;
  }
  .board-col, .right-col { min-width: 0; min-height: 0; }
  .right-col {
    display: grid;
    /* An `auto` first row would size itself to the game card's content and
       overflow the column; `minmax(0, 1fr)` hands the leftovers to that card
       and lets its own scroll area absorb them. */
    grid-template-rows: minmax(0, 1fr) var(--conv-h);
    gap: 1.125rem;
  }
  .board-card { height: 100%; min-height: 0; display: flex; flex-direction: column; }
  .conversation-card { min-height: 0; display: flex; flex-direction: column; }
  @media (max-width: 1040px) {
    /* Stacked layout: there is no room to fit a board plus two cards plus the
       chat side by side, so columns go vertical and the page is allowed to
       scroll again - scaling the text down far enough would make it unreadable. */
    body { overflow-y: auto; }
    .app { display: flex; flex-direction: column; }
    /* The right column keeps its own gap once it stops being a grid: without
       it the game card and the conversation would sit flush against each
       other, since both drop their bottom margin inside their column. */
    .right-col { display: flex; flex-direction: column; gap: 1.125rem; }
    .board-card { height: auto; }
    .board-fit { display: block; }
    #board { height: auto; width: min(100%, 62vh); }
    .conversation-card { height: 60vh; }
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: .875rem 1rem;
    /* No vertical margin: the grid gaps own the spacing between cards. A
       bottom margin here would push the conversation up inside its grid row
       (margins sit inside a grid area) while the board card, sized to 100% of
       its column, would spill it outwards - the two bottom edges would end up
       a margin apart. */
  }
  .card h2 { font-size: .8125rem; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 .625rem; }
  /* The board is a square that must fit whatever height the card has left:
     the wrapper takes the leftover space, the board derives its width from the
     wrapper's height (height: 100% + aspect-ratio), so it can never grow past
     the card and overlap the conversation. */
  .board-fit { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; align-items: center; }
  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    height: 100%;
    width: auto;
    aspect-ratio: 1 / 1;
    max-width: 100%;
    margin: 0 auto;
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .sq {
    display: flex; align-items: center; justify-content: center;
    /* The board is sized from the row height, so the glyphs follow the viewport
       height as well, with the width as a ceiling for the stacked layout where
       the board is capped by the column instead. (Container queries would be
       the natural tool, but `container-type: inline-size` collapses the board's
       own height once the width, not the height, determines its size.) */
    font-size: clamp(1.1rem, min(4.4vh, 4.4vw), 3.2rem);
    cursor: pointer; user-select: none; line-height: 1;
    aspect-ratio: 1 / 1; min-width: 0; min-height: 0; overflow: hidden;
  }
  .sq.light { background: var(--light-square); }
  .sq.dark { background: var(--dark-square); }
  .sq.selected { box-shadow: inset 0 0 0 4px var(--select); }
  .sq.target::after {
    content: ""; width: 34%; height: 34%; border-radius: 50%;
    background: var(--target); position: absolute;
  }
  .sq { position: relative; }
  .sq.last { box-shadow: inset 0 0 0 3px rgba(47,111,235,.55); }
  .coords { display: flex; justify-content: space-between; color: var(--muted); font-size: .75rem; padding: .25rem .125rem; }
  .status { display: flex; gap: .625rem; flex-wrap: wrap; font-size: .8125rem; }
  .pill { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: .1875rem .625rem; font-weight: 600; }
  .pill.warn { background: #fdeceb; color: var(--danger); }
  .pill.gray { background: #eef0f3; color: var(--muted); }
  table.moves { width: 100%; border-collapse: collapse; font-size: .8125rem; }
  table.moves td { padding: .1875rem .375rem; border-bottom: 1px solid #f0f1f4; }
  table.moves td.num { color: var(--muted); width: 2.125rem; }
  /* Game and Moves share one card and one scrollbar: the column is the scroll
     container and the card is a single unshrinkable block inside it. Giving
     Moves its own fixed height (and its own scrollbar) meant guessing how much
     of the row the Game form would leave over - a guess that was wrong as soon
     as a section grew or the window shrank. Letting the card be as tall as its
     content and scrolling the column removes both numbers.
     `overscroll-behavior: contain` is what keeps the page still while the
     column scrolls: without it, once the list hits its end the wheel keeps
     going and chains to the page, which is the "the whole page moves when I
     scroll the chat" bug that the old `overflow: hidden` was working around. */
  .side { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  /* Grow to fill the column so a short game still paints one card the full
     height of the row; never shrink, because the card owns the scroll. */
  .side .card { flex: 1 0 auto; }
  .moves-sub h2 { margin-bottom: .375rem; }
  .chat-head { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; }
  .chat-head h2 { margin: 0 0 .5rem; }
  #chat {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: .5rem;
    padding-right: .25rem; font-size: .8125rem;
  }
  /* An IM-style thread: one bubble per paragraph, the side the operator is
     "looking from" on the right (see rightSide()), the other one on the left. */
  .line { display: flex; }
  .line.right { justify-content: flex-end; }
  .bubble {
    max-width: 80%; border-radius: 10px; padding: .375rem .625rem;
    background: #f1f3f6; border: 1px solid var(--border);
    word-break: break-word; overflow-wrap: anywhere;
  }
  .line.right .bubble { background: var(--accent-soft); border-color: #cfe0ff; }
  .bubble .who {
    font-size: .625rem; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); margin-bottom: .1875rem;
  }
  .bubble .md { line-height: 1.45; }
  .say-row { flex: 0 0 auto; display: flex; gap: .5rem; margin-top: .5rem; }
  .say-row input { flex: 1 1 auto; min-width: 0; }
  /* Markdown produced by renderMarkdown() */
  .md p { margin: .25rem 0; }
  .md p:first-child { margin-top: 0; }
  .md p:last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: .5rem 0 .25rem; font-size: .875rem; }
  .md ul, .md ol { margin: .25rem 0; padding-left: 1.25rem; }
  .md li { margin: .125rem 0; }
  .md blockquote { margin: .25rem 0; padding-left: .5rem; border-left: 2px solid var(--border); color: var(--muted); }
  .md code { background: #eef0f3; border-radius: 4px; padding: 0 3px; font-size: .75rem; }
  .md pre { margin: .375rem 0; background: #f6f7f9; border: 1px solid var(--border); border-radius: 6px; padding: .5rem; overflow: auto; font-size: .75rem; }
  .md pre code { background: none; padding: 0; }
  .md a { color: var(--accent); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: .5rem 0; }
  pre.json { margin: .25rem 0 0; background: #f6f7f9; border: 1px solid var(--border); border-radius: 6px; padding: .5rem; max-height: 12.5rem; overflow: auto; font-size: .75rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  input[type=text], select, button {
    font: inherit; padding: .375rem .625rem; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; color: var(--text);
  }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: var(--accent); }
  button.secondary { background: #fff; color: var(--text); }
  button.danger { background: var(--danger); border-color: var(--danger); }
  /* Without this a disabled control keeps its accent fill and still looks
     clickable - the only cue was the browser's greyed text on a coloured
     background, which is easy to miss. */
  button:disabled, input[type=text]:disabled, select:disabled {
    opacity: .4; cursor: not-allowed;
  }
  input[type=text] { min-width: 5.625rem; }
  .hint { color: var(--muted); font-size: .75rem; }
  .toggle { font-size: .75rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
  #banner { padding: .625rem 1rem; border-radius: 8px; background: #fff7e6; border: 1px solid #ffe0a3; margin-bottom: .75rem; font-size: .8125rem; }
  #banner.hidden { display: none; }
  /* The banner takes ~2.5rem out of a page whose height is fixed to the
     viewport. Take it back from the conversation rather than from the columns,
     which would otherwise start scrolling inside themselves. */
  #banner:not(.hidden) + .app { --conv-h: clamp(6rem, 18vh, 11rem); }
  .card-sub { margin-top: .875rem; border-top: 1px solid var(--border); padding-top: .625rem; }
  .card-sub h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 .25rem; }
  /* Short windows are the one case the rem scale cannot rescue: the right
     column is a fixed number of form rows, not a proportional block. Drop the
     helper copy and tighten the section gaps so the column stays readable
     while it scrolls. */
  @media (max-height: 780px) {
    .hint { display: none; }
    .card-sub { margin-top: .5rem; padding-top: .375rem; }
    .card h2 { margin-bottom: .375rem; }
    .status { font-size: .75rem; gap: .375rem; }
  }
</style>
</head>
<body>
<header>
  <div class="page header-inner">
    <h1>chess-llm</h1>
    <span class="meta" id="game-meta">loading…</span>
    <span class="meta" id="conn">● connecting</span>
  </div>
</header>

<div class="page">
  <div id="banner" class="hidden"></div>
  <main class="app">
    <div class="board-col">
      <div class="card board-card">
        <h2>Board</h2>
        <div class="board-fit"><div id="board"></div></div>
        <div class="coords"><span id="turn-label"></span></div>
        <div class="row" style="margin-top:.625rem">
          <input type="text" id="san" placeholder="SAN, e.g. Nf3" />
          <button id="play">Play move</button>
          <select id="promotion" title="promotion piece">
            <option value="q">promote Q</option>
            <option value="r">promote R</option>
            <option value="b">promote B</option>
            <option value="n">promote N</option>
          </select>
        </div>
        <div class="hint" id="board-hint">Click a piece, then a highlighted target square.</div>
      </div>
    </div>

    <div class="right-col">
      <div class="side">
        <div class="card">
          <h2>Game</h2>
          <div class="status" id="status"></div>

          <div class="card-sub">
            <h3>New game</h3>
            <div class="row" style="margin-top:.375rem">
              <select id="new-white"></select>
              <select id="new-black"></select>
              <button class="secondary" id="new-game">New game</button>
            </div>
            <div class="hint" id="new-hint">Pick who plays each side. An LLM side needs a profile from <code>config.yaml</code>.</div>
          </div>

          <div class="card-sub">
            <h3>Load saved game</h3>
            <div class="row" style="margin-top:.375rem">
              <select id="saved-games"><option value="">load saved game…</option></select>
              <button class="secondary" id="load-game">Load</button>
            </div>
            <label class="toggle" style="margin-top:.5rem; display:inline-block">
              <input type="checkbox" id="override-seats" /> override seats
            </label>
            <div class="row" id="override-row" style="margin-top:.375rem; display:none">
              <select id="load-white"><option value="">(keep stored)</option></select>
              <select id="load-black"><option value="">(keep stored)</option></select>
            </div>
          </div>

          <div class="row" style="margin-top:.75rem">
            <button class="danger" id="resign" title="Resign the game.">Resign</button>
          </div>

          <div class="card-sub moves-sub">
            <h2>Moves</h2>
            <table class="moves" id="moves"></table>
          </div>
        </div>
      </div>

      <div class="card conversation-card">
        <div class="chat-head">
          <h2>Conversation</h2>
        </div>
        <div id="chat"></div>
        <div class="say-row">
          <input type="text" id="say-input" placeholder="Say something to your opponent…" />
          <button id="say-send">Send</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const UNICODE = {K:"\u2654",Q:"\u2655",R:"\u2656",B:"\u2657",N:"\u2658",P:"\u2659",
                 k:"\u265A",q:"\u265B",r:"\u265C",b:"\u265D",n:"\u265E",p:"\u265F"};

let state = null;
let selected = null;
let refreshTimer = null;
let source = null;

const boardEl = document.getElementById("board");
const chatEl = document.getElementById("chat");
const sayInput = document.getElementById("say-input");

function fenToSquares(fen) {
  const placement = fen.split(" ")[0];
  const squares = [];
  for (const row of placement.split("/")) {
    for (const ch of row) {
      if (/\d/.test(ch)) { for (let i = 0; i < parseInt(ch, 10); i++) squares.push(""); }
      else squares.push(ch);
    }
  }
  return squares; // index 0 = a8 ... 63 = h1
}

// Squares are addressed by name everywhere (clicks, highlights, promotion), so
// the display order comes from the orientation instead of the FEN order.
function squareName(index, flipped) {
  const file = index % 8;
  const row = Math.floor(index / 8);
  return "abcdefgh"[flipped ? 7 - file : file] + (flipped ? row + 1 : 8 - row);
}

function pieceAt(squares, name) {
  const file = "abcdefgh".indexOf(name[0]);
  const rank = parseInt(name[1], 10);
  return squares[(8 - rank) * 8 + file] || "";
}

// A single human seat playing black sees the board from black's side. Hot-seat
// games keep white at the bottom because both players share one screen.
function boardFlipped() {
  const seats = humanSides();
  return seats.length === 1 && seats[0] === "black";
}

function renderBoard() {
  if (!state) return;
  const squares = fenToSquares(state.fen);
  const flipped = boardFlipped();
  const legal = new Set((state.legal_moves || []).map(m => m.uci));
  const last = state.moves.length ? state.moves[state.moves.length - 1].uci : null;
  const lastFrom = last ? last.slice(0, 2) : null;
  const lastTo = last ? last.slice(2, 4) : null;

  boardEl.innerHTML = "";
  for (let i = 0; i < 64; i++) {
    const cell = document.createElement("div");
    const name = squareName(i, flipped);
    const fileIndex = "abcdefgh".indexOf(name[0]);
    const rank = parseInt(name[1], 10);
    // a8 and h1 are light squares, so an even file+rank sum means light.
    cell.className = "sq " + (((fileIndex + rank) % 2 === 0) ? "light" : "dark");
    const piece = pieceAt(squares, name);
    cell.textContent = piece ? (UNICODE[piece] || piece) : "";
    if (piece && piece === piece.toUpperCase()) cell.style.color = "#fff";
    cell.dataset.square = name;
    if (selected === name) cell.classList.add("selected");
    if (lastFrom && (name === lastFrom || name === lastTo)) cell.classList.add("last");
    if (selected && legal.has(selected + name) ) cell.classList.add("target");
    if (selected && legal.has(selected + name + "q")) cell.classList.add("target");
    cell.addEventListener("click", () => onSquareClick(name));
    boardEl.appendChild(cell);
  }
}

function onSquareClick(name) {
  if (!state || state.finished) return;
  if (!canPlay(state.turn)) { flash(state.turn + " is not a human seat in this game."); return; }
  const legal = state.legal_moves || [];
  if (selected) {
    const promo = document.getElementById("promotion").value;
    const match = legal.find(m => m.uci === selected + name)
      || legal.find(m => m.uci === selected + name + promo)
      || legal.find(m => m.uci.startsWith(selected + name));
    if (match) { selected = null; sendMove(match.san); return; }
  }
  const own = legal.find(m => m.uci.startsWith(name));
  selected = own ? name : null;
  renderBoard();
}

// Both sides can be human (hot-seat mode), so this returns a list.
function humanSides() {
  if (!state) return [];
  const out = [];
  if (state.white.kind === "human") out.push("white");
  if (state.black.kind === "human") out.push("black");
  return out;
}

function canPlay(side) {
  return humanSides().indexOf(side) !== -1;
}

// True while an LLM seat is the side to move and the board is waiting on it.
// The empty (no-game) state has no game_id, so it never looks like "thinking".
function waitingOnLlm() {
  return !!state && !!state.game_id && !state.finished && !canPlay(state.turn);
}

// The seat a human controls; in hot-seat mode that is whoever is to move.
function humanSide() {
  const seats = humanSides();
  if (!seats.length) return null;
  if (state && canPlay(state.turn)) return state.turn;
  return seats[0];
}

async function sendMove(move) {
  const res = await fetch("/api/move", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({move})
  });
  const data = await res.json();
  if (!res.ok) {
    flash((data.error && data.error.message) || "Move rejected.");
  }
  await refresh();
}

function renderStatus() {
  const el = document.getElementById("status");
  const pills = [];
  pills.push(`<span class="pill">turn: ${state.turn}</span>`);
  pills.push(`<span class="pill ${state.in_check ? "warn" : "gray"}">${state.check_status}</span>`);
  pills.push(`<span class="pill gray">halfmove clock: ${state.halfmove_clock}</span>`);
  pills.push(`<span class="pill gray">move ${state.fullmove_number}</span>`);
  pills.push(`<span class="pill gray">${state.white_name} vs ${state.black_name}</span>`);
  if (waitingOnLlm()) {
    pills.push(`<span class="pill">${state.turn} (LLM) is thinking…</span>`);
  }
  if (state.finished && state.result) {
    pills.push(`<span class="pill warn">${state.result.pgn_result} · ${state.result.reason}</span>`);
  }
  el.innerHTML = pills.join(" ");

  document.getElementById("game-meta").textContent =
    `${state.game_id} · ${state.mode}` + (state.finished ? " · finished" : "");
  document.getElementById("turn-label").textContent = state.finished
    ? "game over"
    : (waitingOnLlm() ? `${state.turn} is thinking…` : `${state.turn} to move`);

  // Keep the "new game" dropdowns in sync with the game that is loaded (but not
  // while we are in the empty no-game state, so the user's picks survive).
  if (state.game_id) {
    selectSeat(document.getElementById("new-white"), seatValue(state.white));
    selectSeat(document.getElementById("new-black"), seatValue(state.black));
  }

  // One fixed label: the button either works or it is greyed out. Why it is
  // unavailable lives in the tooltip, so the label does not have to double as a
  // status description ("Resign (no human seat)" read like an error message).
  const seats = humanSides();
  const resignBtn = document.getElementById("resign");
  resignBtn.textContent = "Resign";
  if (!seats.length) {
    resignBtn.disabled = true;
    resignBtn.title = "Both sides are models: they resign through their own tools.";
  } else if (state.finished) {
    resignBtn.disabled = true;
    resignBtn.title = "The game is over.";
  } else {
    const side = humanSide();
    resignBtn.disabled = false;
    // Hot-seat: the click can only ever resign the side to move, because the
    // page cannot tell the two players apart. Say so instead of surprising them.
    resignBtn.title = seats.length === 2
      ? `${side === "white" ? "White" : "Black"} to move - resigning ends the game for ${side}.`
      : `You play ${side} - resigning ends the game.`;
  }

  // The SAN box and the move button are how a human gets onto the board, so
  // they are greyed out whenever the position is not waiting for one. Taking
  // the input and then answering "not your turn" makes the user spend a move
  // to learn something the page already knew.
  let blocked = null;
  if (!state.game_id) {
    blocked = "Start or load a game first.";
  } else if (state.finished) {
    blocked = "The game is over.";
  } else if (!canPlay(state.turn)) {
    blocked = seats.length
      ? `${state.turn === "white" ? "White" : "Black"} is played by a model.`
      : "Both sides are models: they play through their own tools.";
  }
  for (const id of ["san", "play", "promotion"]) {
    const el = document.getElementById(id);
    el.disabled = !!blocked;
    if (blocked) el.title = blocked;
    else el.removeAttribute("title");
  }
  if (blocked) selected = null;

  // Speaking follows the server's answer, not the board: a human may heckle
  // while the opponent is thinking, so this is not tied to whose turn it is.
  // `say_side` is null for a game with no human seat and once it is over.
  const sayBtn = document.getElementById("say-send");
  const canSay = !!state.say_side && !state.finished;
  sayInput.disabled = !canSay;
  sayBtn.disabled = !canSay;
  let sayWhy = "";
  if (!state.game_id) sayWhy = "Start or load a game first.";
  else if (state.finished) sayWhy = "The game is over.";
  else if (!canSay) sayWhy = "Both sides are models: they talk through their own tools.";
  if (sayWhy) {
    sayInput.title = sayWhy;
    sayBtn.title = sayWhy;
    sayInput.placeholder = sayWhy;
  } else {
    sayInput.removeAttribute("title");
    sayBtn.removeAttribute("title");
    const who = state.say_side === "white" ? state.white_name : state.black_name;
    sayInput.placeholder = `Say something as ${who || state.say_side}…`;
  }
}

function renderMoves() {
  const table = document.getElementById("moves");
  const rows = [];
  for (let i = 0; i < state.moves.length; i += 2) {
    const w = state.moves[i], b = state.moves[i + 1];
    rows.push(`<tr><td class="num">${(i / 2) + 1}.</td><td>${w ? w.san : ""}</td><td>${b ? b.san : ""}</td></tr>`);
  }
  table.innerHTML = rows.join("") || '<tr><td class="num">-</td><td>no moves yet</td><td></td></tr>';
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Only these link schemes survive; anything else is rendered as plain text so
// a model cannot smuggle javascript: URLs into the page.
function safeLink(label, url) {
  const raw = String(url).replace(/&amp;/g, "&");
  if (/^[a-z][a-z0-9+.-]*:/i.test(raw) && !/^(https?|mailto):/i.test(raw)) return label;
  return `<a href="${url}" target="_blank" rel="noreferrer noopener">${label}</a>`;
}

// Minimal Markdown renderer - enough for what an LLM writes, and dependency
// free so the page keeps working offline. HTML is escaped before anything is
// emitted, so model output can never inject markup.
function renderMarkdown(text) {
  const source = String(text || "");
  if (!source.trim()) return "";

  const codes = [];
  // Inline code is stashed first so bold/italic never rewrites its inside.
  const stashCode = (chunk) => chunk.replace(/`([^`\n]+)`/g, (_m, code) => {
    codes.push(`<code>${code}</code>`);
    return "\u0001" + (codes.length - 1) + "\u0001";
  });

  const inline = (chunk) => {
    let t = chunk
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/(^|[^_\w])_([^_\n]+)_/g, "$1<em>$2</em>")
      .replace(/~~([^~\n]+)~~/g, "<del>$1</del>")
      .replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, (_m, label, url) => safeLink(label || url, url));
    t = t.replace(/\u0001(\d+)\u0001/g, (_m, i) => codes[Number(i)] || "");
    return t.replace(/\n/g, "<br>");
  };

  const blocks = [];
  let para = [], quote = [], list = null, fence = null;
  const flushPara = () => { if (para.length) { blocks.push(`<p>${inline(para.join("\n"))}</p>`); para = []; } };
  const flushQuote = () => { if (quote.length) { blocks.push(`<blockquote>${inline(quote.join("\n"))}</blockquote>`); quote = []; } };
  const flushList = () => {
    if (!list) return;
    blocks.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`);
    list = null;
  };
  const flushAll = () => { flushPara(); flushQuote(); flushList(); };

  for (const raw of source.split("\n")) {
    // Fenced code: collected verbatim, never parsed as Markdown.
    if (fence === null && /^\s*```[ \t]*[A-Za-z0-9_+-]*\s*$/.test(raw)) { flushAll(); fence = []; continue; }
    if (fence !== null && /^\s*```\s*$/.test(raw)) {
      blocks.push(`<pre><code>${escapeHtml(fence.join("\n"))}</code></pre>`);
      fence = null;
      continue;
    }
    if (fence !== null) { fence.push(raw); continue; }

    const line = stashCode(escapeHtml(raw));
    if (!line.trim()) { flushAll(); continue; }
    const heading = line.match(/^\s*(#{1,6})\s+(.*)$/);
    if (heading) {
      flushAll();
      const level = Math.min(heading[1].length + 2, 6);
      blocks.push(`<h${level}>${inline(heading[2])}</h${level}>`);
      continue;
    }
    if (/^\s*([-*_])\s*(\1\s*){2,}$/.test(line)) { flushAll(); blocks.push("<hr>"); continue; }
    // ">" has already been escaped into "&gt;" by escapeHtml().
    const quoted = line.match(/^\s*&gt;\s?(.*)$/);
    if (quoted) { flushPara(); flushList(); quote.push(quoted[1]); continue; }
    const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
    if (bullet) { flushPara(); flushQuote(); if (!list || list.tag !== "ul") { flushList(); list = {tag: "ul", items: []}; } list.items.push(bullet[1]); continue; }
    const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (numbered) { flushPara(); flushQuote(); if (!list || list.tag !== "ol") { flushList(); list = {tag: "ol", items: []}; } list.items.push(numbered[1]); continue; }
    flushQuote(); flushList(); para.push(line);
  }
  flushAll();
  // An unclosed fence still gets rendered rather than dropped.
  if (fence !== null) blocks.push(`<pre><code>${escapeHtml(fence.join("\n"))}</code></pre>`);
  return blocks.join("");
}

// Who sits on the right of the thread. One human at the board -> that human;
// otherwise white, which covers LLM vs LLM and hot-seat (where both players
// share the screen and neither of them is "the viewer").
function rightSide() {
  const seats = humanSides();
  if (seats.length === 1) return seats[0];
  return "white";
}

// One bubble per conversation entry. The backend has already split a remark
// into paragraphs, so every entry is exactly one message.
function renderChat() {
  const entries = state.conversation || [];
  const right = rightSide();
  const parts = [];
  for (const entry of entries) {
    const side = entry.side === "white" ? "white" : "black";
    const name = side === "white" ? state.white_name : state.black_name;
    const align = side === right ? " right" : "";
    parts.push(
      `<div class="line${align}"><div class="bubble">` +
        `<div class="who">${escapeHtml(name || side)}</div>` +
        `<div class="md">${renderMarkdown(entry.text || "")}</div>` +
      `</div></div>`
    );
  }
  // Nothing here may suggest that a turn is in progress: whether a model is
  // thinking is already answered by the status line above, and a bubble in the
  // thread would look like it had said something.
  if (!parts.length) {
    chatEl.innerHTML = '<div class="hint">Nothing said yet.</div>';
    return;
  }
  chatEl.innerHTML = parts.join("");
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function sendSay() {
  const text = sayInput.value.trim();
  if (!text || !state || !state.say_side) return;
  const res = await fetch("/api/say", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({side: state.say_side, text})
  });
  if (!res.ok) { await showApiError(res); return; }
  sayInput.value = "";
  await refresh();
}

function renderBanner() {
  const banner = document.getElementById("banner");
  if (state.finished && state.result) {
    banner.classList.remove("hidden");
    banner.innerHTML = `<strong>Game over:</strong> ${escapeHtml(state.result.reason)} — ${escapeHtml(state.result.detail || "")} (${state.result.pgn_result})`;
  } else {
    banner.classList.add("hidden");
  }
}

function render() {
  if (!state) return;
  renderStatus();
  renderBoard();
  renderMoves();
  renderChat();
  renderBanner();
}

async function refresh() {
  const res = await fetch("/api/state");
  const data = await res.json();
  if (!data || !data.game_id) {
    // No game running yet: show the board (starting position) but no moves.
    state = {
      game_id: null,
      fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
      legal_moves: [], moves: [],
      white: {kind: null, display_name: "white"},
      black: {kind: null, display_name: "black"},
      white_name: "white", black_name: "black",
      turn: "white", check_status: "no check", in_check: false,
      finished: false, result: null, conversation: [], say_side: null,
      halfmove_clock: 0, fullmove_number: 1, mode: "—",
      white_chat_history: [], black_chat_history: [],
    };
    render();
    document.getElementById("game-meta").textContent = "no game — start a new game or load a saved one";
    document.getElementById("turn-label").textContent = "no game loaded";
    return;
  }
  state = data;
  render();
}

function scheduleRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refresh, 120);
}

function flash(message) {
  const banner = document.getElementById("banner");
  banner.classList.remove("hidden");
  banner.textContent = message;
  setTimeout(() => { if (!state.finished) banner.classList.add("hidden"); renderBanner(); }, 2500);
}

document.getElementById("play").addEventListener("click", () => {
  const value = document.getElementById("san").value.trim();
  if (!value) return;
  document.getElementById("san").value = "";
  sendMove(value);
});

document.getElementById("say-send").addEventListener("click", sendSay);
sayInput.addEventListener("keydown", (e) => {
  // Enter sends; the box is single-line by design, so there is no Shift+Enter
  // to worry about and no reason to make the operator reach for the mouse.
  if (e.key === "Enter") { e.preventDefault(); sendSay(); }
});

async function showApiError(res) {
  let detail = "request failed";
  try {
    const data = await res.json();
    detail = data.detail || JSON.stringify(data);
  } catch (e) { /* keep default */ }
  flash(String(detail));
}

// Profile list (names from config.yaml, plus a configured flag for warnings).
let profiles = [];

async function loadProfiles() {
  try {
    const res = await fetch("/api/profiles");
    const data = await res.json();
    profiles = data.profiles || [];
  } catch (e) { profiles = []; }
  fillSideSelect(document.getElementById("new-white"), false);
  fillSideSelect(document.getElementById("new-black"), false);
  fillSideSelect(document.getElementById("load-white"), true);
  fillSideSelect(document.getElementById("load-black"), true);
}

// How a seat is spelled as an option value: "human" or "llm:<profile>".
// `kind` alone is not enough - it would be "llm" for every model, which matches
// no option and leaves the select showing whatever it showed before.
function seatValue(spec) {
  // A stored seat with no profile name keeps an empty name: "llm:". Inventing a
  // placeholder word here would look like a profile that actually exists.
  return spec.kind === "llm" ? `llm:${spec.profile || ""}` : "human";
}

// Set a side select to a stored seat, adding the option when the list does not
// contain it. Ways that happens: the profile was removed from config.yaml after
// the game was saved, the stored seat never had a profile name, or
// /api/profiles failed and `profiles` is empty. Assigning a value with no
// matching option does nothing at all, so the select would keep displaying its
// first entry - "human" - for a seat a model is playing. The extra option shows
// the bare value, marked red: no invented name and no status word next to it.
function selectSeat(select, value) {
  if (!Array.from(select.options).some(o => o.value === value)) {
    const opt = document.createElement("option");
    opt.value = value;
    opt.textContent = value.replace(":", ": ");
    opt.style.color = "var(--danger)";
    select.appendChild(opt);
  }
  select.value = value;
}

// Build the options for one side: "human", then "llm:<name>" for every profile.
// When keepStored is true a leading "(keep stored)" option (value "") is added,
// used by the load-override selectors.
function fillSideSelect(select, keepStored) {
  // Replacing innerHTML resets the control to its first option. Keep whatever
  // it was showing when that value survives the rebuild - otherwise every
  // profile reload silently turns "llm: local" back into "human".
  const previous = select.value;
  let html = keepStored ? '<option value="">(keep stored)</option>' : "";
  html += '<option value="human">human</option>';
  for (const p of profiles) {
    const warn = p.configured ? "" : " (no API key)";
    const color = p.configured ? "" : ' style="color:var(--danger)"';
    html += `<option value="llm:${p.name}"${color}>llm: ${p.name}${warn}</option>`;
  }
  select.innerHTML = html;
  if (previous && Array.from(select.options).some(o => o.value === previous)) {
    select.value = previous;
  }
}

document.getElementById("new-game").addEventListener("click", async () => {
  const body = {
    white: document.getElementById("new-white").value,
    black: document.getElementById("new-black").value
  };
  const res = await fetch("/api/new", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  if (!res.ok) { await showApiError(res); return; }
  selected = null;
  await refresh();
});

document.getElementById("resign").addEventListener("click", async () => {
  const side = humanSide();
  if (!side) { flash("There is no human side in this game."); return; }
  const res = await fetch("/api/resign", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({side})});
  if (!res.ok) { await showApiError(res); return; }
  await refresh();
});

document.getElementById("load-game").addEventListener("click", async () => {
  const gameId = document.getElementById("saved-games").value;
  if (!gameId) return;
  const body = { game_id: gameId };
  if (document.getElementById("override-seats").checked) {
    body.white = document.getElementById("load-white").value || null;
    body.black = document.getElementById("load-black").value || null;
  }
  const res = await fetch("/api/load", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  if (!res.ok) { await showApiError(res); return; }
  selected = null;
  await refresh();
});

document.getElementById("override-seats").addEventListener("change", (e) => {
  document.getElementById("override-row").style.display = e.target.checked ? "flex" : "none";
});

async function loadSavedGames() {
  const res = await fetch("/api/games");
  const data = await res.json();
  const select = document.getElementById("saved-games");
  select.innerHTML = '<option value="">load saved game…</option>' +
    (data.games || []).map(g => `<option value="${g}">${g}</option>`).join("");
}

function connect() {
  if (source) source.close();
  source = new EventSource("/api/events");
  source.addEventListener("open", () => {
    document.getElementById("conn").textContent = "● live";
    document.getElementById("conn").style.color = "#2e9e5b";
  });
  source.addEventListener("message", (event) => {
    const payload = JSON.parse(event.data);
    if (payload.type === "connected") return;

    // Nothing the model writes as plain text is shown any more: its public
    // lines arrive through the `speak` tool. Streaming deltas have no visual
    // consumer at all, so both are ignored.
    if (payload.type === "llm_delta" || payload.type === "llm_message") return;

    if (payload.type === "game_started" || payload.type === "game_loaded") {
      // A replacement game must not inherit the previous game's selection. The
      // server also stops forwarding events from a game that has been
      // replaced, so nothing else from it can arrive.
      selected = null;
      sayInput.value = "";
      loadSavedGames();
      loadProfiles();
      scheduleRefresh();
      return;
    }

    // A turn starting or a tool running says nothing about who said what - only
    // state-changing events (a remark, a move, a result) are worth a repaint.
    // Refreshing on all of them would repaint the board dozens of times per
    // turn for no visible change.
    if (payload.type === "turn_start" || payload.type === "tool_call" ||
        payload.type === "tool_result" || payload.type === "user_prompt" ||
        payload.type === "nudge") return;

    // say / move / state / game_over / resign / llm_error / fallback_move: the
    // authoritative state changed. Rebuilding from it is what prints the new
    // bubble, and there is no locally drawn text to lose any more.
    scheduleRefresh();
  });
  source.addEventListener("error", () => {
    document.getElementById("conn").textContent = "● offline";
    document.getElementById("conn").style.color = "#c0392b";
  });
}

(async function init() {
  // Profiles first: renderStatus() puts the loaded game's seats into the "new
  // game" dropdowns during that first refresh, and it can only pick an option
  // that already exists. With the other order the selects show "human" for a
  // moment, until loadProfiles() rebuilds them.
  await loadProfiles();
  await refresh();
  await loadSavedGames();
  connect();
  setInterval(loadSavedGames, 30000);
  // Safety net: while an LLM is to move, poll as well as listen, so the board
  // still catches up if the event stream drops. Also revive a dead stream.
  setInterval(() => {
    if (waitingOnLlm()) { refresh().catch(() => {}); }
    if (source && source.readyState === 2) connect();
  }, 2000);
})();
</script>
